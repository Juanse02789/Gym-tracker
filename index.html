<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Gym Tracker Pro</title>
<style>
:root{--bg:#0b0d10;--surface:#15181d;--surface2:#1d2128;--text:#f5f7fa;--muted:#9aa3af;--border:#2b313b;--accent:#6ee7b7;--danger:#fb7185;--shadow:0 10px 30px #0005}
:root.light{--bg:#f4f6f8;--surface:#fff;--surface2:#eef1f5;--text:#101318;--muted:#667085;--border:#d8dee8;--accent:#087f5b;--danger:#c92a45;--shadow:0 8px 24px #0001}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}button{cursor:pointer}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:92px}
header{position:sticky;top:0;z-index:10;padding:18px 18px 12px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.headrow{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:28px;margin:0}.sub{color:var(--muted);margin-top:3px;font-size:14px}
main{padding:14px 14px 24px}.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:15px;margin:11px 0;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn{border:0;border-radius:12px;padding:11px 14px;background:var(--accent);color:#06140e;font-weight:750}.btn.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}.btn.danger{background:color-mix(in srgb,var(--danger) 20%,var(--surface));color:var(--danger)}
.iconbtn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:12px;width:42px;height:42px}
input,select{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:11px;padding:10px}label{display:block;color:var(--muted);font-size:12px;margin:8px 0 5px}
h2,h3{margin:5px 0 8px}.muted{color:var(--muted)}.small{font-size:13px}.big{font-size:27px;font-weight:800}.pill{display:inline-block;padding:5px 9px;border-radius:99px;background:var(--surface2);font-size:12px;color:var(--muted)}
.exercise{padding:12px 0;border-top:1px solid var(--border)}.set{display:grid;grid-template-columns:1fr 1fr 44px;gap:7px;margin-top:7px}.check{border:0;border-radius:10px;background:var(--surface2);color:var(--text);font-size:19px}.check.done{background:var(--accent);color:#06140e}
nav{position:fixed;z-index:20;bottom:0;left:0;right:0;display:flex;justify-content:center;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--border)}
nav button{flex:1;max-width:150px;background:none;border:0;color:var(--muted);padding:10px 3px 15px;font-size:12px}nav button.active{color:var(--text);font-weight:800}
.empty{text-align:center;padding:42px 15px;color:var(--muted)}.stat{background:var(--surface2);border:1px solid var(--border);padding:12px;border-radius:14px}
.bar{height:9px;border-radius:99px;background:var(--surface2);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calhead,.day{text-align:center;font-size:12px}.calhead{color:var(--muted);padding:5px 0}.day{min-height:38px;border:1px solid var(--border);border-radius:9px;padding:7px 2px;background:var(--surface)}.day.train{background:color-mix(in srgb,var(--accent) 28%,var(--surface));border-color:var(--accent)}.day.today{outline:2px solid var(--text)}
.timer{font-size:58px;text-align:center;font-weight:850;letter-spacing:2px;padding:15px}.timerBtns{display:flex;gap:8px}.timerBtns .btn{flex:1}
.modal{position:fixed;inset:0;background:#0009;z-index:40;display:none;align-items:end;justify-content:center;padding:12px}.modal.show{display:flex}.sheet{width:min(760px,100%);max-height:88vh;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:18px;box-shadow:0 20px 60px #0008}.chips{display:flex;gap:7px;overflow:auto;padding:4px 0 10px}.chip{white-space:nowrap;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:99px;padding:7px 10px}.exercisePick{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border:1px solid var(--border);border-radius:13px;margin:7px 0;background:var(--surface2)}.hero{padding:20px;border-radius:22px;background:linear-gradient(135deg,var(--surface2),var(--surface));border:1px solid var(--border);margin-bottom:14px}.accent{color:var(--accent)}.toast{position:fixed;left:50%;bottom:85px;transform:translateX(-50%);background:#111;color:#fff;padding:11px 15px;border-radius:12px;display:none;z-index:50}
@media(max-width:520px){.grid2{grid-template-columns:1fr}.grid3{grid-template-columns:1fr 1fr 1fr}.big{font-size:23px}}
</style>
</head>
<body>
<div class="app">
<header><div class="headrow"><div><h1 id="title">Entrenamiento</h1><div class="sub" id="subtitle">Entrena, registra y mide tu progreso</div></div><button class="iconbtn" onclick="toggleTheme()" id="themeBtn">☀️</button></div></header>
<main id="main"></main>
<nav>
<button data-tab="workout">🏋️<br>Entrenar</button>
<button data-tab="routines">📋<br>Rutinas</button>
<button data-tab="progress">📊<br>Progreso</button>
<button data-tab="calendar">🗓️<br>Calendario</button>
</nav>
<div id="toast" class="toast"></div>
<script>
const KEY='gymTrackerProV1';
const exerciseCatalog=[
 {name:'Press banca',muscle:'Pecho'},{name:'Press inclinado con mancuernas',muscle:'Pecho'},
 {name:'Aperturas en máquina',muscle:'Pecho'},{name:'Dominadas',muscle:'Espalda'},
 {name:'Jalón al pecho',muscle:'Espalda'},{name:'Remo con barra',muscle:'Espalda'},
 {name:'Remo en máquina',muscle:'Espalda'},{name:'Press militar',muscle:'Hombros'},
 {name:'Elevaciones laterales',muscle:'Hombros'},{name:'Face pull',muscle:'Hombros'},
 {name:'Curl de bíceps',muscle:'Bíceps'},{name:'Curl martillo',muscle:'Bíceps'},
 {name:'Extensión de tríceps en polea',muscle:'Tríceps'},{name:'Fondos',muscle:'Tríceps'},
 {name:'Sentadilla',muscle:'Cuádriceps'},{name:'Prensa',muscle:'Cuádriceps'},
 {name:'Extensión de cuádriceps',muscle:'Cuádriceps'},{name:'Peso muerto rumano',muscle:'Isquios'},
 {name:'Curl femoral',muscle:'Isquios'},{name:'Hip thrust',muscle:'Glúteos'},
 {name:'Elevación de gemelos',muscle:'Pantorrillas'},{name:'Abdominales en polea',muscle:'Abdomen'}
];
const defaultData={
 routines:[{id:'r1',name:'Pierna',exercises:[
  {id:'e1',name:'Sentadilla',muscle:'Cuádriceps',sets:3,reps:8},
  {id:'e2',name:'Prensa',muscle:'Cuádriceps',sets:3,reps:10},
  {id:'e3',name:'Curl femoral',muscle:'Isquios',sets:3,reps:10}]}],
 customExercises:[], sessions:[], weights:[], current:null, theme:'dark'
};
let data=JSON.parse(localStorage.getItem(KEY)||'null')||defaultData; data.customExercises=data.customExercises||[];
let tab='workout', timerSeconds=90, timerRunning=false, timerId=null;
const $=x=>document.getElementById(x), uid=()=>Math.random().toString(36).slice(2,10);
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1800)}
function toggleTheme(){data.theme=data.theme==='dark'?'light':'dark';applyTheme();save()}
function applyTheme(){document.documentElement.classList.toggle('light',data.theme==='light');$('themeBtn').textContent=data.theme==='dark'?'☀️':'🌙'}
function render(){applyTheme();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));({workout:renderWorkout,routines:renderRoutines,progress:renderProgress,calendar:renderCalendar}[tab])()}
function renderWorkout(){
 $('title').textContent='Entrenamiento';$('subtitle').textContent='Registra series y progreso';
 if(!data.current){
  $('main').innerHTML=`<div class="card"><div class="row"><div><h2>¿Qué vas a entrenar?</h2><div class="muted">Selecciona una rutina.</div></div><button class="btn secondary" onclick="quickWeight()">⚖️ Peso</button></div>
  ${data.routines.map(r=>`<button class="btn secondary" style="width:100%;margin:6px 0;text-align:left" onclick="start('${r.id}')">${esc(r.name)} <span style="float:right">${r.exercises.length} ejercicios</span></button>`).join('')||'<div class="empty">Crea una rutina primero.</div>'}</div>
  <div class="card"><div class="row"><div><b>Temporizador de descanso</b><div class="muted small">Úsalo entre series.</div></div><button class="btn secondary" onclick="openTimer()">⏱️ Abrir</button></div></div>`;
  return;
 }
 const r=data.routines.find(x=>x.id===data.current.routineId);
 $('main').innerHTML=`<div class="row"><span class="pill">${esc(r?.name||'Rutina')}</span><button class="btn danger" onclick="finish()">Terminar</button></div>
 <div class="card"><div class="row"><b>Temporizador</b><button class="btn secondary" onclick="openTimer()">⏱️ ${fmt(timerSeconds)}</button></div></div>
 ${data.current.exercises.map((e,ei)=>`<div class="card"><div class="row"><div><b>${esc(e.name)}</b><div class="muted small">${esc(e.muscle)} · ${e.sets} series · ${e.reps} reps</div></div></div>
 ${e.logged.map((s,si)=>`<div class="set"><input type="number" step="0.5" placeholder="kg" value="${s.kg}" oninput="log(${ei},${si},'kg',this.value)"><input type="number" placeholder="reps" value="${s.reps}" oninput="log(${ei},${si},'reps',this.value)"><button class="check ${s.done?'done':''}" onclick="toggleSet(${ei},${si})">✓</button></div>`).join('')}</div>`).join('')}`;
}
function start(id){const r=data.routines.find(x=>x.id===id);data.current={routineId:id,started:new Date().toISOString(),exercises:r.exercises.map(e=>({name:e.name,muscle:e.muscle,sets:e.sets,reps:e.reps,logged:Array.from({length:e.sets},()=>({kg:'',reps:e.reps,done:false}))}))};save();render()}
function log(e,s,k,v){data.current.exercises[e].logged[s][k]=v;save()}
function toggleSet(e,s){data.current.exercises[e].logged[s].done=!data.current.exercises[e].logged[s].done;save();renderWorkout();if(data.current?.exercises[e].logged[s].done)startTimer(90)}
function finish(){if(!confirm('¿Guardar este entrenamiento?'))return;data.sessions.unshift({id:uid(),routineId:data.current.routineId,date:new Date().toISOString(),exercises:data.current.exercises});data.current=null;save();render();toast('Entrenamiento guardado')}
function quickWeight(){const v=prompt('Peso actual (kg):');if(!v||isNaN(v))return;data.weights.push({date:new Date().toISOString(),kg:Number(v)});save();toast('Peso guardado')}
function renderRoutines(){
 $('title').textContent='Rutinas';$('subtitle').textContent='Construye tus entrenamientos a tu manera';
 $('main').innerHTML=`<div class="hero"><div class="row"><div><span class="pill">TU PLAN</span><h2 style="margin-top:8px">Mis rutinas</h2><div class="muted">Añade ejercicios sugeridos o crea los tuyos.</div></div><button class="btn" onclick="newRoutine()">＋ Rutina</button></div></div>
 ${data.routines.map(r=>`<div class="card"><div class="row"><div><h3>${esc(r.name)}</h3><div class="muted">${r.exercises.length} ejercicios</div></div><div style="display:flex;gap:6px"><button class="iconbtn" onclick="copyRoutine('${r.id}')">⧉</button><button class="btn secondary" onclick="manageRoutine('${r.id}')">Gestionar</button></div></div>
 <div class="muted small" style="margin-top:12px">${r.exercises.length? r.exercises.slice(0,5).map(e=>`<span class="pill" style="margin:2px">${esc(e.name)}</span>`).join('') : 'Añade tu primer ejercicio →'}</div>
 ${r.exercises.length>5?`<div class="muted small" style="margin-top:8px">+${r.exercises.length-5} más</div>`:''}</div>`).join('')}`;
}
function newRoutine(){
 const name=prompt('Nombre de la rutina:');
 if(!name?.trim())return;
 const r={id:uid(),name:name.trim(),exercises:[]}; data.routines.push(r); save(); manageRoutine(r.id);
}
function copyRoutine(id){
 const r=data.routines.find(x=>x.id===id);
 const name=prompt('Nombre de la copia:',r.name+' (copia)');
 if(!name?.trim())return;
 data.routines.push({id:uid(),name:name.trim(),exercises:r.exercises.map(e=>({...e,id:uid()}))});
 save();renderRoutines();toast('Rutina copiada');
}
function manageRoutine(id){
 const r=data.routines.find(x=>x.id===id);
 $('main').innerHTML=`<div class="row"><button class="btn secondary" onclick="renderRoutines()">← Rutinas</button><button class="btn danger" onclick="deleteRoutine('${id}')">Eliminar</button></div>
 <div class="card"><div class="row"><div><span class="pill">EDITANDO</span><h2>${esc(r.name)}</h2><div class="muted">${r.exercises.length} ejercicios</div></div><button class="btn" onclick="openExercisePicker('${id}')">＋ Ejercicio</button></div></div>
 ${r.exercises.length?r.exercises.map((e,i)=>`<div class="card"><div class="row"><div><b>${esc(e.name)}</b><div class="muted small">${esc(e.muscle)}</div></div><button class="iconbtn" onclick="removeExercise('${id}',${i})">🗑️</button></div>
 <div class="grid2"><div><label>Series</label><input type="number" min="1" value="${e.sets}" onchange="updateExercise('${id}',${i},'sets',this.value)"></div><div><label>Repeticiones</label><input type="number" min="1" value="${e.reps}" onchange="updateExercise('${id}',${i},'reps',this.value)"></div></div></div>`).join(''):`<div class="empty">Esta rutina todavía está vacía.<br><br><button class="btn" onclick="openExercisePicker('${id}')">Añadir ejercicio</button></div>`}`;
}
function deleteRoutine(id){
 if(data.routines.length===1){toast('Debes conservar al menos una rutina');return}
 if(!confirm('¿Eliminar esta rutina?'))return;
 data.routines=data.routines.filter(r=>r.id!==id);save();renderRoutines();
}
function removeExercise(rid,i){
 data.routines.find(r=>r.id===rid).exercises.splice(i,1);save();manageRoutine(rid);toast('Ejercicio eliminado');
}
function updateExercise(rid,i,key,value){
 const e=data.routines.find(r=>r.id===rid).exercises[i];e[key]=Math.max(1,Number(value)||1);save();
}
function openExercisePicker(rid){
 const r=data.routines.find(x=>x.id===rid);
 $('main').insertAdjacentHTML('beforeend',`<div class="modal show" id="exerciseModal" onclick="if(event.target.id==='exerciseModal')closeExercisePicker()">
 <div class="sheet"><div class="row"><div><span class="pill">NUEVO EJERCICIO</span><h2>Añadir a ${esc(r.name)}</h2></div><button class="iconbtn" onclick="closeExercisePicker()">✕</button></div>
 <input id="exerciseSearch" placeholder="Buscar ejercicio..." oninput="filterExercises('${rid}')">
 <div class="chips"><button class="chip" onclick="filterMuscle('${rid}','Todos')">Todos</button>${['Pecho','Espalda','Hombros','Bíceps','Tríceps','Cuádriceps','Isquios','Glúteos','Pantorrillas','Abdomen'].map(m=>`<button class="chip" onclick="filterMuscle('${rid}','${m}')">${m}</button>`).join('')}</div>
 <div id="exerciseList"></div>
 <div class="card" style="margin-bottom:0"><h3>¿No encuentras el ejercicio?</h3><button class="btn secondary" style="width:100%" onclick="createExercise('${rid}')">＋ Crear ejercicio personalizado</button></div>
 </div></div>`);
 filterExercises(rid);
}
function closeExercisePicker(){document.getElementById('exerciseModal')?.remove()}
function allExercises(){return [...exerciseCatalog,...data.customExercises.map(e=>({...e,custom:true}))]}
let exerciseMuscleFilter='Todos';
function filterMuscle(rid,m){exerciseMuscleFilter=m;filterExercises(rid)}
function filterExercises(rid){
 const q=(document.getElementById('exerciseSearch')?.value||'').toLowerCase();
 const list=allExercises().filter(e=>(exerciseMuscleFilter==='Todos'||e.muscle===exerciseMuscleFilter)&&e.name.toLowerCase().includes(q));
 const added=new Set(data.routines.find(r=>r.id===rid).exercises.map(e=>e.name));
 $('exerciseList').innerHTML=list.length?list.map((e,i)=>`<div class="exercisePick"><div><b>${esc(e.name)}</b><div class="muted small">${esc(e.muscle)}${e.custom?' · Personalizado':''}</div></div>${added.has(e.name)?'<span class="pill">Añadido</span>':`<button class="btn secondary" onclick="addExercise('${rid}',${JSON.stringify(e.name)},${JSON.stringify(e.muscle)})">Añadir</button>`}</div>`).join(''):'<div class="empty">No hay coincidencias.</div>';
}
function addExercise(rid,name,muscle){
 const r=data.routines.find(x=>x.id===rid);
 if(r.exercises.some(e=>e.name===name)){toast('Ese ejercicio ya está en la rutina');return}
 r.exercises.push({id:uid(),name,muscle,sets:3,reps:10});save();filterExercises(rid);toast('Ejercicio añadido');
}
function createExercise(rid){
 const name=prompt('Nombre del ejercicio:');
 if(!name?.trim())return;
 const muscle=prompt('Grupo muscular (ej. Pecho, Espalda, Piernas):','Otro')||'Otro';
 data.customExercises.push({id:uid(),name:name.trim(),muscle:muscle.trim()||'Otro'});
 save();filterExercises(rid);toast('Ejercicio personalizado creado');
}
function renderProgress(){
 $('title').textContent='Progreso';$('subtitle').textContent='Peso, récords y volumen';
 const ws=[...data.weights].sort((a,b)=>a.date.localeCompare(b.date)), latest=ws.at(-1)?.kg;
 const prs={};data.sessions.forEach(s=>s.exercises.forEach(e=>e.logged.forEach(x=>{if(x.kg&&x.reps){const k=e.name;prs[k]=Math.max(prs[k]||0,Number(x.kg))}})));
 const vols={};data.sessions.forEach(s=>s.exercises.forEach(e=>e.logged.forEach(x=>{if(x.done&&x.kg&&x.reps)vols[e.muscle]=(vols[e.muscle]||0)+Number(x.kg)*Number(x.reps)})));
 const maxVol=Math.max(1,...Object.values(vols));
 $('main').innerHTML=`<div class="grid2"><div class="stat"><div class="muted">Peso actual</div><div class="big">${latest?latest+' kg':'—'}</div></div><div class="stat"><div class="muted">Entrenamientos</div><div class="big">${data.sessions.length}</div></div></div>
 <div class="card"><div class="row"><h2>Evolución de peso</h2><button class="btn secondary" onclick="addWeight()">＋ Peso</button></div>
 ${ws.length?`<div style="height:150px;display:flex;align-items:end;gap:5px;padding:12px 2px">${ws.slice(-20).map(w=>`<div title="${w.kg} kg · ${new Date(w.date).toLocaleDateString('es-CO')}" style="flex:1;height:${Math.max(8,(w.kg-(Math.min(...ws.map(x=>x.kg))-2))*12)}px;max-height:120px;background:var(--accent);border-radius:5px 5px 0 0"></div>`).join('')}</div><div class="muted small">${new Date(ws[0].date).toLocaleDateString('es-CO')} → ${new Date(ws.at(-1).date).toLocaleDateString('es-CO')}</div>`:'<div class="empty">Registra tu peso para ver la evolución.</div>'}</div>
 <div class="card"><h2>🏆 Récords personales</h2>${Object.keys(prs).length?Object.entries(prs).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`<div class="row" style="padding:9px 0;border-top:1px solid var(--border)"><span>${esc(n)}</span><b>${v} kg</b></div>`).join(''):'<div class="empty">Completa series con peso para generar PRs.</div>'}</div>
 <div class="card"><h2>📦 Volumen por músculo</h2>${Object.keys(vols).length?Object.entries(vols).sort((a,b)=>b[1]-a[1]).map(([m,v])=>`<div style="margin:12px 0"><div class="row"><span>${esc(m)}</span><b>${Math.round(v).toLocaleString('es-CO')} kg</b></div><div class="bar"><i style="width:${v/maxVol*100}%"></i></div></div>`).join(''):'<div class="empty">Todavía no hay volumen registrado.</div>'}</div>
 <div class="card"><h2>⏱️ Temporizador</h2><div class="timer">${fmt(timerSeconds)}</div><div class="timerBtns"><button class="btn secondary" onclick="startTimer(60)">60s</button><button class="btn secondary" onclick="startTimer(90)">90s</button><button class="btn secondary" onclick="startTimer(120)">120s</button><button class="btn" onclick="toggleTimer()">${timerRunning?'Pausa':'Iniciar'}</button></div></div>`;
}
function addWeight(){const v=prompt('Peso actual (kg):');if(!v||isNaN(v))return;data.weights.push({date:new Date().toISOString(),kg:Number(v)});save();renderProgress()}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function startTimer(sec){timerSeconds=sec;timerRunning=true;clearInterval(timerId);timerId=setInterval(()=>{if(timerSeconds>0){timerSeconds--;updateTimer()}else{clearInterval(timerId);timerRunning=false;toast('¡Descanso terminado!')}} ,1000);updateTimer()}
function toggleTimer(){if(timerRunning){timerRunning=false;clearInterval(timerId)}else{timerRunning=true;timerId=setInterval(()=>{if(timerSeconds>0){timerSeconds--;updateTimer()}else{clearInterval(timerId);timerRunning=false;toast('¡Descanso terminado!')}},1000)}updateTimer()}
function updateTimer(){document.querySelectorAll('.timer').forEach(x=>x.textContent=fmt(timerSeconds));const b=document.querySelector('.timerBtns .btn:last-child');if(b)b.textContent=timerRunning?'Pausa':'Iniciar'}
function openTimer(){tab='progress';render();setTimeout(()=>document.querySelector('.timer')?.scrollIntoView({behavior:'smooth'}),50)}
function renderCalendar(){
 $('title').textContent='Calendario';$('subtitle').textContent='Tus días de entrenamiento';
 const now=new Date(), y=now.getFullYear(),m=now.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
 const dates=new Set(data.sessions.map(s=>new Date(s.date).toISOString().slice(0,10)));let cells='';
 for(let i=0;i<((first+6)%7);i++)cells+='<div></div>';
 for(let d=1;d<=days;d++){const key=new Date(y,m,d).toISOString().slice(0,10);const today=d===now.getDate();cells+=`<div class="day ${dates.has(key)?'train':''} ${today?'today':''}">${d}${dates.has(key)?'<br>🏋️':''}</div>`}
 $('main').innerHTML=`<div class="card"><div class="row"><h2>${now.toLocaleDateString('es-CO',{month:'long',year:'numeric'})}</h2><span class="pill">${data.sessions.filter(s=>{const d=new Date(s.date);return d.getFullYear()===y&&d.getMonth()===m}).length} entrenos</span></div><div class="calendar"><div class="calhead">L</div><div class="calhead">M</div><div class="calhead">X</div><div class="calhead">J</div><div class="calhead">V</div><div class="calhead">S</div><div class="calhead">D</div>${cells}</div></div>
 <div class="card"><h3>Últimos entrenamientos</h3>${data.sessions.slice(0,8).map(s=>`<div class="row" style="padding:9px 0;border-top:1px solid var(--border)"><span>${new Date(s.date).toLocaleDateString('es-CO',{weekday:'short',day:'numeric',month:'short'})}</span><b>${esc(data.routines.find(r=>r.id===s.routineId)?.name||'Rutina')}</b></div>`).join('')||'<div class="empty">Aún no hay entrenamientos.</div>'}</div>`;
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
render();
